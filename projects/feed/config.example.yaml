# Feed configuration
# Copy to ~/.config/feed/config.yaml

gmail:
  # Gmail label to scan for food emails. Create this label in Gmail
  # and apply it to your food newsletters (manually or via filters).
  label: "FOOD"

  # Maximum emails to process per run. Prevents huge first-run PDFs.
  max_emails_per_run: 20

remarkable:
  # Folder on reMarkable where magazines are uploaded.
  # Created automatically if it doesn't exist.
  folder: "/Feed"

magazine:
  # Maximum articles/recipes to include per issue.
  max_articles: 15

  # Maximum content links to extract per email.
  max_links_per_email: 3

  # Where to save generated PDFs locally (also serves as a backup).
  output_dir: "~/feed-output"

logging:
  # debug | info | warning | error
  level: "info"
